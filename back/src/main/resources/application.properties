#set-up fake database
spring.datasource.url=jdbc:h2:mem://localhost:3306/fc_repo
spring.datasource.driver-class-name=org.h2.Driver
# Change l'URL de Swagger UI
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.path=/docs
# Choix par defaut pour eviter warning
spring.jpa.open-in-view=truespring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
