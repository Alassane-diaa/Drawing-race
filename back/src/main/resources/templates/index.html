<!DOCTYPE html>
<html>
<head>
    <script>
        function getCharacters() {
            fetch("http://localhost:8080/characters")
                .then(function (response) {
                    return response.text();
                }).then(function (json) {
                document.getElementById("include").innerHTML="";
                const list = document.getElementById("include");
                JSON.parse(json).forEach(person => {
                    const li = document.createElement("li");
                    li.textContent = `${person.firstname} ${person.lastname} de ${person.univers} (id: ${person.id})`;
                    list.appendChild(li);
                });
            });
        }

        function postAddCharacter(){
            const firstname = document.getElementById("firstname").value;
            const lastname = document.getElementById("lastname").value;
            const univers = document.getElementById("univers").value;
            fetch("http://localhost:8080/addCharacter", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    firstname: ""+firstname,
                    lastname: ""+lastname,
                    univers: ""+univers
                })
            })
        }
    </script>
</head>
<body>
<button onclick="getCharacters()">Get /characters</button>
</br></br>
<div id="include"></div>
</br>
<button onclick="postAddCharacter()">Post /addCharacter</button>
<input id="firstname"></input>
<input id="lastname"></input>
<input id="univers"></input>
</body>
</html>
